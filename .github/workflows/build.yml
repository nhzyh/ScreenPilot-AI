name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - ScreenPilotAI_Android_round4.zip
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_FILE: ${{ github.workspace }}/ci.keystore
      KEYSTORE_PASSWORD: android
      KEYSTORE_ALIAS: androiddebugkey
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ScreenPilotAI_Android_round4.zip
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | LC_ALL=C tr -cd 'A-Za-z0-9+/=')
          echo "Cleaned secret length: ${#CLEAN}"
          printf '%s' "$CLEAN" | base64 -d > "$KEYSTORE_FILE"
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" >/dev/null
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: cd ScreenPilotAI && gradle assembleDebug
      - name: Verify APK signature
        run: |
          cp ScreenPilotAI/app/build/outputs/apk/debug/app-debug.apk ScreenPilotAI.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found"; exit 1; fi
          "$APKSIGNER" verify --print-certs ScreenPilotAI.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VC=$(grep -oP 'versionCode = \K[0-9]+' ScreenPilotAI/app/build.gradle.kts)
          VN=$(grep -oP 'versionName = "\K[^"]+' ScreenPilotAI/app/build.gradle.kts)
          gh release delete "v$VC" --yes --cleanup-tag || true
          gh release create "v$VC" ScreenPilotAI.apk --title "V$VN" --notes-file ScreenPilotAI/RELEASE_NOTES.txt
