name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - ScreenPilotAI_Android_round12.zip
      - .github/workflows/build.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_FILE: ${{ github.workspace }}/ci.keystore
      KEYSTORE_PASSWORD: android
      KEYSTORE_ALIAS: androiddebugkey
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ScreenPilotAI_Android_round12.zip
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | LC_ALL=C tr -cd 'A-Za-z0-9+/=')
          echo "Cleaned secret length: ${#CLEAN}"
          printf '%s' "$CLEAN" | base64 -d > "$KEYSTORE_FILE"
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" >/dev/null
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build release APK
        run: cd ScreenPilotAI && gradle assembleRelease
      - name: Align and sign APK
        run: |
          set -euo pipefail
          SRC=$(find ScreenPilotAI/app/build/outputs/apk/release -type f -name '*.apk' | sort | head -n1)
          if [ -z "$SRC" ]; then echo "Release APK not found"; exit 1; fi
          ALIGNED=ScreenPilotAI/app/build/outputs/apk/release/app-aligned.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found"; exit 1; fi
          TOOLS_DIR=$(dirname "$APKSIGNER")
          "$TOOLS_DIR/zipalign" -f -p 4 "$SRC" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            "$ALIGNED"
          cp "$ALIGNED" ScreenPilotAI.apk
      - name: Verify APK signature and release build
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found"; exit 1; fi
          if [ -z "$AAPT2" ]; then echo "aapt2 not found"; exit 1; fi
          VERIFY_OUT=$("$APKSIGNER" verify --verbose --print-certs ScreenPilotAI.apk)
          echo "$VERIFY_OUT"
          echo "$VERIFY_OUT" | grep -Eq 'Verified using v2 scheme \(APK Signature Scheme v2\): true'
          BADGING=$("$AAPT2" dump badging ScreenPilotAI.apk)
          echo "$BADGING"
          if echo "$BADGING" | grep -q 'application-debuggable'; then
            echo 'Release APK must not be debuggable'
            exit 1
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VC=$(grep -oP 'versionCode = \K[0-9]+' ScreenPilotAI/app/build.gradle.kts)
          VN=$(grep -oP 'versionName = "\K[^"]+' ScreenPilotAI/app/build.gradle.kts)
          gh release delete "v$VC" --yes --cleanup-tag || true
          gh release create "v$VC" ScreenPilotAI.apk --title "V$VN" --notes-file ScreenPilotAI/RELEASE_NOTES.txt
